%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/st,ftm5.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics FingerTip FTM5 touchscreen controller

maintainers:
  - Dmitry Torokhov <dmitry.torokhov@gmail.com>

description: ST FTM5 touchscreen controller connected over SPI.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: st,ftm5

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vdd-supply: true

  avdd-supply: true

  spi-max-frequency: true

required:
  - compatible
  - reg
  - reset-gpios
  - vdd-supply
  - avdd-supply
  - spi-max-frequency
  - touchscreen-size-x
  - touchscreen-size-y

oneOf:
  - required:
      - interrupts
  - required:
      - interrupts-extended

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
      #address-cells = <1>;
      #size-cells = <0>;

      touchscreen@0 {
        compatible = "st,ftm5";
        reg = <0>;
        spi-max-frequency = <12000000>;
        interrupts-extended = <&tlmm 25 IRQ_TYPE_LEVEL_LOW>;
        reset-gpios = <&tlmm 24 GPIO_ACTIVE_LOW>;
        vdd-supply = <&vdd>;
        avdd-supply = <&avdd>;
        touchscreen-size-x = <10800>;
        touchscreen-size-y = <24000>;
      };
    };

...
